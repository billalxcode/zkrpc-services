worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Avoid recording note IDs, nullifiers, client request IDs or query strings.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        # Resolve Docker service addresses again after a service is recreated.
        set $server_upstream http://server:3000;
        set $indexer_upstream http://indexer:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;

        # Dashboard browser memanggil API ini langsung: izinkan CORS di semua
        # route publik + jawab preflight, kalau tidak browser blokir (ERR_FAILED).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-ZKAPI-Testnet-Password" always;

        location = /health { proxy_pass $server_upstream; }
        location = /v1/attestation { proxy_pass $server_upstream; }
        location /v2/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass $server_upstream;
        }
        location /v1/tree/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass $indexer_upstream;
        }
        location = /config.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/request.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/withdrawal.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/manifest.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        # Includes the decoded operator dashboard and every unknown route.
        location / { return 404; }
    }
}
